      <h1>Titulo del contacto</h1>
      <form action=" ">
        <div>
          <label for="nombre">Nombres: </label>
          <input type="text" pattern="[a-zA-Z\s]+" title="SOLO LETRAS" id="nombre" required>
        </div>
        <div>
          <label for="apellido">Apellidos: </label>
          <input type="text" pattern="[a-zA-Z\s]+" title="SOLO LETRAS" id="apellido" required>
        </div>
        <div>
          <label for="edad">Edad: </label>
          <input type="number" step="1" max="99" required>
        </div>
        <div>
          <label for="ciudad">Ciudad: </label>
          <select name="ciudad" id="ciudad" required>
          <option value="1">Bucaramanga</option>
          <option value="2">Giron</option>
          </select>
        </div>
        <button>Guardar</button>
      </form>
    </section>
